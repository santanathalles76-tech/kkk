# Usado apenas se publicar pela linha de comando (npx wrangler deploy).
# Pelo painel da Cloudflare este arquivo não é necessário.
name = "duda-push"
main = "worker.js"
compatibility_date = "2025-06-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "duda-push"
database_id = "COLE_AQUI_O_ID_DO_BANCO"

[vars]
ALLOWED_ORIGIN = ""
VAPID_SUBJECT = ""
