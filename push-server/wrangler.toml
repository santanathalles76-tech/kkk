# Alternativa: use este arquivo se configurar "Root directory" = push-server na Cloudflare.
# O normal é usar o wrangler.toml da raiz do projeto.
name = "kkk"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "duda-push"
database_id = "4f087553-1088-405c-a729-a59b2a2cb385"

[vars]
ALLOWED_ORIGIN = ""
VAPID_SUBJECT = ""
